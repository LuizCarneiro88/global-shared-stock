<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Área da empresa | Global Shared Stock</title>
    <style>
      :root { color-scheme: dark; --background: #090b0d; --surface: #111418; --text: #f4f5f6; --muted: #a9afb7; --silver: #c5c9ce; --line: #343940; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; background: var(--background); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      main { width: min(100% - 24px, 760px); margin: 0 auto; padding: 36px 0; }
      .brand { color: var(--silver); font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
      h1 { font-size: clamp(2.1rem, 10vw, 3.7rem); }
      .panel { margin-top: 28px; padding: 24px 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); }
      .panel p { color: var(--muted); line-height: 1.55; }
      button { min-height: 46px; padding: 10px 16px; border: 1px solid #555b63; border-radius: 10px; background: transparent; color: var(--text); font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Global Shared Stock</p>
      <h1>Área da empresa</h1>
      <section class="panel">
        <h2>Acesso ativado</h2>
        <p>Seu acesso está funcionando. O cadastro manual de materiais será disponibilizado na próxima etapa.</p>
      </section>
      <form action="/api/logout" method="post"><button type="submit">Sair</button></form>
    </main>
  </body>
</html>
