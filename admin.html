<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Área de análise da Global Shared Stock." />
    <title>Administração | Global Shared Stock</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #090b0d;
        --surface: #111418;
        --surface-light: #171b20;
        --text: #f4f5f6;
        --muted: #a9afb7;
        --silver: #c5c9ce;
        --line: #343940;
        --success: #acd2b1;
        --danger: #efaaaa;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--background);
      }

      body {
        position: relative;
        isolation: isolate;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: var(--background);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body::before {
        position: fixed;
        z-index: -1;
        inset: 0;
        content: "";
        background:
          linear-gradient(
            180deg,
            rgba(9, 11, 13, 0.38),
            rgba(9, 11, 13, 0.7)
          ),
          url("assets/global-shared-stock-background.png") center / cover
            no-repeat;
        opacity: 0.78;
        pointer-events: none;
      }

      main {
        width: min(100% - 24px, 900px);
        margin: 0 auto;
        padding: 28px 0 56px;
      }

      header {
        margin-bottom: 32px;
        text-align: center;
      }

      .brand {
        margin: 0 0 28px;
        color: var(--silver);
        font-size: clamp(1.15rem, 4vw, 1.75rem);
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 10vw, 3.7rem);
        line-height: 1.02;
        letter-spacing: -0.045em;
        text-wrap: balance;
      }

      .introduction {
        max-width: 620px;
        margin: 18px auto 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }

      .summary-item {
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(17, 20, 24, 0.94);
      }

      .summary-number {
        display: block;
        margin-bottom: 5px;
        font-size: 1.7rem;
        font-weight: 800;
      }

      .summary-label {
        color: var(--muted);
        font-size: 0.8rem;
      }

      .company-card {
        padding: 22px 16px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(17, 20, 24, 0.96);
      }

      .company-list {
        display: grid;
        gap: 20px;
      }

      .empty-state {
        margin: 0;
        padding: 28px 18px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(17, 20, 24, 0.96);
        color: var(--muted);
        line-height: 1.5;
        text-align: center;
      }

      .card-header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      h2 {
        margin: 0;
        font-size: 1.45rem;
      }

      .example-note {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .status {
        padding: 7px 10px;
        border: 1px solid #5a5f67;
        border-radius: 999px;
        color: var(--silver);
        font-size: 0.75rem;
        font-weight: 750;
        white-space: nowrap;
      }

      .status.approved {
        border-color: #57735c;
        color: var(--success);
      }

      .status.rejected {
        border-color: #805858;
        color: var(--danger);
      }

      .details {
        display: grid;
        gap: 16px;
        margin: 20px 0;
      }

      .detail {
        min-width: 0;
      }

      .detail dt {
        margin-bottom: 5px;
        color: var(--muted);
        font-size: 0.76rem;
      }

      .detail dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .documents {
        padding: 18px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      h3 {
        margin: 0 0 12px;
        font-size: 0.95rem;
      }

      .document-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .document {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-light);
      }

      .document-name {
        min-width: 0;
        overflow: hidden;
        font-size: 0.86rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .document-button {
        flex: none;
        border: 0;
        background: transparent;
        color: var(--silver);
        font: inherit;
        font-size: 0.8rem;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 20px;
      }

      .action-button {
        min-height: 50px;
        padding: 12px 16px;
        border: 1px solid #555b63;
        border-radius: 11px;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      .approve-button {
        background: var(--silver);
        color: #121519;
      }

      .reject-button {
        background: transparent;
        color: var(--text);
      }

      button:focus-visible,
      .back-link:focus-visible {
        outline: 3px solid rgba(197, 201, 206, 0.32);
        outline-offset: 3px;
      }

      .feedback {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.45;
        text-align: center;
      }

      .feedback[hidden] {
        display: none;
      }

      .access-panel {
        display: grid;
        gap: 10px;
        margin-top: 16px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: var(--surface-light);
      }

      .access-panel[hidden] {
        display: none;
      }

      .access-link {
        width: 100%;
        min-height: 44px;
        padding: 10px;
        border: 1px solid #555b63;
        border-radius: 9px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
      }

      .back-link {
        display: block;
        width: fit-content;
        margin: 24px auto 0;
        color: var(--silver);
        font-size: 0.9rem;
        text-underline-offset: 4px;
      }

      .logout-form {
        margin-top: 18px;
        text-align: center;
      }

      .logout-button {
        min-height: 44px;
        padding: 8px 16px;
        border: 1px solid #555b63;
        border-radius: 10px;
        background: rgba(17, 20, 24, 0.94);
        color: var(--silver);
        font: inherit;
        cursor: pointer;
      }

      @media (min-width: 650px) {
        main {
          padding: 48px 0 72px;
        }

        .summary {
          max-width: 420px;
          margin-right: auto;
          margin-left: auto;
        }

        .company-card {
          padding: 28px;
        }

        .details {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .actions {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 600px) {
        body::before {
          background:
            linear-gradient(
              180deg,
              rgba(9, 11, 13, 0.3),
              rgba(9, 11, 13, 0.72)
            ),
            url("assets/global-shared-stock-background.png") center 52% / 100%
              auto no-repeat;
          opacity: 0.82;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="brand">Global Shared Stock</p>
        <h1>Cadastros de empresas</h1>
        <p class="introduction">
          Analise os dados enviados antes de liberar o acesso à plataforma.
        </p>
      </header>

      <section class="summary" aria-label="Resumo dos cadastros">
        <div class="summary-item">
          <strong id="pending-count" class="summary-number">0</strong>
          <span class="summary-label">Aguardando análise</span>
        </div>
        <div class="summary-item">
          <strong id="approved-count" class="summary-number">0</strong>
          <span class="summary-label">Aprovados hoje</span>
        </div>
      </section>

      <section id="company-list" class="company-list" aria-live="polite">
        <p class="empty-state">Carregando solicitações...</p>
      </section>

      <a class="back-link" href="index.html">Voltar ao início</a>
      <form class="logout-form" action="/api/logout" method="post">
        <button class="logout-button" type="submit">Sair da administração</button>
      </form>
    </main>

    <script>
      const companyList = document.querySelector("#company-list");
      const pendingCount = document.querySelector("#pending-count");
      const approvedCount = document.querySelector("#approved-count");

      const interestLabels = { buy: "Compra", sell: "Venda", both: "Compra e venda" };
      const inventoryLabels = {
        "under-100k": "Abaixo de R$ 100 mil",
        "100k-to-999k": "Entre R$ 100 mil e R$ 999 mil",
        "1m-to-5m": "Entre R$ 1 milhão e R$ 5 milhões",
        "over-5m": "Acima de R$ 5 milhões",
      };
      const statusLabels = {
        pending: { label: "Aguardando análise", className: "" },
        approved: { label: "Aprovada", className: "approved" },
        rejected: { label: "Recusada", className: "rejected" },
      };

      function formatCnpj(value) {
        return value.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5");
      }

      function addDetail(list, label, value) {
        const item = document.createElement("div");
        const term = document.createElement("dt");
        const description = document.createElement("dd");
        item.className = "detail";
        term.textContent = label;
        description.textContent = value || "Não informado";
        item.append(term, description);
        list.append(item);
      }

      function createCompanyCard(company) {
        const article = document.createElement("article");
        article.className = "company-card";

        const cardHeader = document.createElement("div");
        cardHeader.className = "card-header";
        const title = document.createElement("h2");
        title.textContent = company.companyName;
        const status = document.createElement("span");
        const statusInformation = statusLabels[company.status] || statusLabels.pending;
        status.className = `status ${statusInformation.className}`.trim();
        status.textContent = statusInformation.label;
        cardHeader.append(title, status);

        const details = document.createElement("dl");
        details.className = "details";
        addDetail(details, "CNPJ", formatCnpj(company.cnpj));
        addDetail(details, "Interesse", interestLabels[company.interest]);
        addDetail(details, "Contato principal", company.primaryContact);
        addDetail(details, "E-mail principal", company.primaryEmail);
        addDetail(details, "Tamanho do estoque", inventoryLabels[company.inventorySize]);
        addDetail(details, "Recebido em", new Intl.DateTimeFormat("pt-BR", { dateStyle: "long", timeStyle: "short" }).format(new Date(company.receivedAt)));

        const documents = document.createElement("section");
        documents.className = "documents";
        const documentsTitle = document.createElement("h3");
        documentsTitle.textContent = "Documentos";
        const documentList = document.createElement("ul");
        documentList.className = "document-list";
        company.documents.forEach((documentInformation) => {
          const item = document.createElement("li");
          item.className = "document";
          const name = document.createElement("span");
          name.className = "document-name";
          name.textContent = documentInformation.name;
          const link = document.createElement("a");
          link.className = "document-button";
          link.href = `/api/cadastros/${company.id}/documentos/${documentInformation.id}`;
          link.target = "_blank";
          link.rel = "noopener";
          link.textContent = "Visualizar";
          item.append(name, link);
          documentList.append(item);
        });
        documents.append(documentsTitle, documentList);

        const actions = document.createElement("div");
        actions.className = "actions";
        const approveButton = document.createElement("button");
        approveButton.className = "action-button approve-button";
        approveButton.type = "button";
        approveButton.textContent = "Aprovar empresa";
        const rejectButton = document.createElement("button");
        rejectButton.className = "action-button reject-button";
        rejectButton.type = "button";
        rejectButton.textContent = "Recusar cadastro";
        actions.append(approveButton, rejectButton);

        const feedback = document.createElement("p");
        feedback.className = "feedback";
        feedback.role = "status";
        feedback.tabIndex = -1;
        feedback.hidden = true;

        const accessPanel = document.createElement("section");
        accessPanel.className = "access-panel";
        accessPanel.hidden = company.status !== "approved";
        const accessTitle = document.createElement("h3");
        accessTitle.textContent = "Acesso da empresa";
        const generateAccessButton = document.createElement("button");
        generateAccessButton.className = "action-button reject-button";
        generateAccessButton.type = "button";
        generateAccessButton.textContent = "Gerar link de acesso";
        const generateResetButton = document.createElement("button");
        generateResetButton.className = "action-button reject-button";
        generateResetButton.type = "button";
        generateResetButton.textContent = "Gerar link para redefinir senha";
        const accessLink = document.createElement("input");
        accessLink.className = "access-link";
        accessLink.type = "text";
        accessLink.readOnly = true;
        accessLink.hidden = true;
        accessLink.setAttribute("aria-label", "Link temporário de acesso");
        const copyAccessButton = document.createElement("button");
        copyAccessButton.className = "action-button approve-button";
        copyAccessButton.type = "button";
        copyAccessButton.textContent = "Copiar link";
        copyAccessButton.hidden = true;
        accessPanel.append(accessTitle, generateAccessButton, generateResetButton, accessLink, copyAccessButton);

        async function updateStatus(newStatus) {
          approveButton.disabled = true;
          rejectButton.disabled = true;
          feedback.hidden = true;
          try {
            const response = await fetch(`/api/cadastros/${company.id}`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ status: newStatus }),
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || "Não foi possível salvar a decisão.");
            company.status = newStatus;
            company.decidedAt = result.company.decidedAt;
            const information = statusLabels[newStatus];
            status.className = `status ${information.className}`;
            status.textContent = information.label;
            accessPanel.hidden = newStatus !== "approved";
            feedback.textContent = newStatus === "approved" ? "Empresa aprovada com sucesso." : "Cadastro recusado com sucesso.";
            feedback.hidden = false;
            feedback.focus();
            updateSummary(window.companies);
          } catch (error) {
            feedback.textContent = error.message;
            feedback.hidden = false;
            feedback.focus();
          } finally {
            approveButton.disabled = false;
            rejectButton.disabled = false;
          }
        }

        approveButton.addEventListener("click", () => updateStatus("approved"));
        rejectButton.addEventListener("click", () => updateStatus("rejected"));
        generateAccessButton.addEventListener("click", async () => {
          generateAccessButton.disabled = true;
          feedback.hidden = true;
          try {
            const response = await fetch(`/api/cadastros/${company.id}/acesso`, { method: "POST" });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || "Não foi possível gerar o link.");
            accessLink.value = result.link;
            accessLink.hidden = false;
            copyAccessButton.hidden = false;
            feedback.textContent = "Link criado. Ele vence em 24 horas e pode ser usado uma vez.";
            feedback.hidden = false;
            feedback.focus();
          } catch (error) {
            feedback.textContent = error.message;
            feedback.hidden = false;
            feedback.focus();
          } finally {
            generateAccessButton.disabled = false;
          }
        });
        generateResetButton.addEventListener("click", async () => {
          generateResetButton.disabled = true;
          feedback.hidden = true;
          try {
            const response = await fetch(`/api/cadastros/${company.id}/redefinir-senha`, { method: "POST" });
            const result = await response.json();
            if (!response.ok) throw new Error(result.message || "Não foi possível gerar o link.");
            accessLink.value = result.link;
            accessLink.hidden = false;
            copyAccessButton.hidden = false;
            copyAccessButton.textContent = "Copiar link";
            feedback.textContent = "Link de redefinição criado. Ele vence em 30 minutos e pode ser usado uma vez.";
            feedback.hidden = false;
            feedback.focus();
          } catch (error) {
            feedback.textContent = error.message;
            feedback.hidden = false;
            feedback.focus();
          } finally {
            generateResetButton.disabled = false;
          }
        });
        copyAccessButton.addEventListener("click", async () => {
          await navigator.clipboard.writeText(accessLink.value);
          copyAccessButton.textContent = "Link copiado";
        });
        article.append(cardHeader, details, documents, actions, feedback, accessPanel);
        return article;
      }

      function updateSummary(companies) {
        pendingCount.textContent = companies.filter((company) => company.status === "pending").length;
        const today = new Date().toDateString();
        approvedCount.textContent = companies.filter(
          (company) => company.status === "approved" && company.decidedAt && new Date(company.decidedAt).toDateString() === today,
        ).length;
      }

      async function loadCompanies() {
        try {
          const response = await fetch("/api/cadastros", { headers: { Accept: "application/json" } });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || "Não foi possível carregar as solicitações.");
          window.companies = result.companies;
          companyList.replaceChildren();
          updateSummary(window.companies);
          if (window.companies.length === 0) {
            const empty = document.createElement("p");
            empty.className = "empty-state";
            empty.textContent = "Nenhuma solicitação de cadastro foi recebida.";
            companyList.append(empty);
            return;
          }
          window.companies.forEach((company) => companyList.append(createCompanyCard(company)));
        } catch (error) {
          const message = document.createElement("p");
          message.className = "empty-state";
          message.textContent = error.message;
          companyList.replaceChildren(message);
        }
      }

      loadCompanies();

    </script>
  </body>
</html>
