<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CNPJ — Empresa Exemplo Ltda.</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; color: #172033; background: #eef1f5; font-family: Arial, sans-serif; }
      main { width: min(100%, 760px); min-height: min(900px, calc(100vh - 48px)); padding: 48px 24px; display: grid; place-content: center; gap: 28px; text-align: center; background: #fff; border: 1px solid #ccd2dc; box-shadow: 0 8px 30px rgb(23 32 51 / 10%); }
      h1 { margin: 0; font-size: clamp(1.7rem, 7vw, 3rem); }
      p { margin: 0; font-size: clamp(1rem, 4vw, 1.35rem); line-height: 1.5; }
      .notice { color: #9a231b; font-weight: 700; }
      @media print { body { padding: 0; background: #fff; } main { min-height: 100vh; border: 0; box-shadow: none; } }
    </style>
  </head>
  <body>
    <main>
      <h1>CNPJ — EMPRESA EXEMPLO LTDA.</h1>
      <p>00000000000000</p>
      <p class="notice">DOCUMENTO FICTÍCIO — APENAS PARA DEMONSTRAÇÃO — SEM VALIDADE JURÍDICA</p>
    </main>
  </body>
</html>
