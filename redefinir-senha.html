<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Redefinição de senha da empresa na Global Shared Stock." />
    <title>Redefinir senha | Global Shared Stock</title>
    <style>
      :root { color-scheme: dark; --background: #090b0d; --surface: #111418; --surface-light: #171b20; --text: #f4f5f6; --muted: #a9afb7; --silver: #c5c9ce; --line: #343940; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px 12px; background: #090b0d url("assets/global-shared-stock-background.png") center / cover fixed; color: var(--text); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      main { width: min(100%, 460px); padding: 24px 16px; border: 1px solid var(--line); border-radius: 18px; background: rgba(17, 20, 24, 0.96); }
      .brand { margin: 0 0 24px; color: var(--silver); font-weight: 800; letter-spacing: 0.14em; text-align: center; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 10vw, 3rem); text-align: center; }
      .introduction { margin: 14px 0 24px; color: var(--muted); line-height: 1.5; text-align: center; }
      form { display: grid; gap: 18px; }
      label { display: block; margin-bottom: 8px; font-weight: 700; }
      input { width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid #464c54; border-radius: 10px; background: var(--surface-light); color: var(--text); font: inherit; }
      button { min-height: 50px; border: 1px solid #555b63; border-radius: 11px; background: var(--silver); color: #121519; font: inherit; font-weight: 750; cursor: pointer; }
      button:disabled { cursor: wait; opacity: 0.65; }
      .status { margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); line-height: 1.45; text-align: center; }
      .status[hidden] { display: none; }
      @media (min-width: 500px) { main { padding: 30px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Global Shared Stock</p>
      <h1>Crie uma nova senha</h1>
      <p class="introduction">Use uma senha exclusiva com pelo menos 12 caracteres.</p>
      <form id="reset-form">
        <div><label for="password">Nova senha</label><input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required /></div>
        <div><label for="confirmation">Confirme a nova senha</label><input id="confirmation" type="password" minlength="12" maxlength="128" autocomplete="new-password" required /></div>
        <button id="submit-button" type="submit">Salvar nova senha</button>
        <p id="status" class="status" role="status" tabindex="-1" hidden></p>
      </form>
    </main>
    <script>
      const form = document.querySelector("#reset-form");
      const button = document.querySelector("#submit-button");
      const status = document.querySelector("#status");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!form.reportValidity()) return;
        if (form.password.value !== form.confirmation.value) {
          status.textContent = "As senhas informadas são diferentes.";
          status.hidden = false;
          status.focus();
          return;
        }
        button.disabled = true;
        button.textContent = "Salvando nova senha...";
        status.hidden = true;
        try {
          const token = new URLSearchParams(location.search).get("token") || "";
          const response = await fetch("/api/acesso/redefinir", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, password: form.password.value }) });
          const result = await response.json();
          if (!response.ok) throw new Error(result.message || "Não foi possível redefinir a senha.");
          status.textContent = "Senha alterada com sucesso. Você será encaminhado para entrar.";
          status.hidden = false;
          status.focus();
          form.reset();
          setTimeout(() => { location.href = "/login-empresa"; }, 1500);
        } catch (error) {
          status.textContent = error.message;
          status.hidden = false;
          status.focus();
          button.disabled = false;
          button.textContent = "Salvar nova senha";
        }
      });
    </script>
  </body>
</html>
