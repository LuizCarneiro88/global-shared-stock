<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Acesso à plataforma Global Shared Stock."
    />
    <title>Entrar | Global Shared Stock</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #090b0d;
        --surface: #111418;
        --surface-light: #171b20;
        --text: #f4f5f6;
        --muted: #a9afb7;
        --silver: #c5c9ce;
        --line: #343940;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--background);
      }

      body {
        position: relative;
        isolation: isolate;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: var(--background);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body::before {
        position: fixed;
        z-index: -1;
        inset: 0;
        content: "";
        background:
          linear-gradient(
            180deg,
            rgba(9, 11, 13, 0.38),
            rgba(9, 11, 13, 0.7)
          ),
          url("assets/global-shared-stock-background.png") center / cover
            no-repeat;
        opacity: 0.78;
        pointer-events: none;
      }

      main {
        display: grid;
        width: min(100% - 24px, 460px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 0;
        place-items: center;
      }

      .content {
        width: 100%;
      }

      header {
        margin-bottom: 30px;
        text-align: center;
      }

      .brand {
        margin: 0 0 28px;
        color: var(--silver);
        font-size: clamp(1.15rem, 4vw, 1.75rem);
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 12vw, 3.4rem);
        line-height: 1;
        letter-spacing: -0.045em;
      }

      .introduction {
        margin: 16px 0 0;
        color: var(--muted);
        line-height: 1.55;
      }

      form {
        display: grid;
        gap: 18px;
        padding: 24px 16px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(17, 20, 24, 0.94);
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.92rem;
        font-weight: 650;
      }

      input {
        width: 100%;
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid #464c54;
        border-radius: 10px;
        outline: none;
        background: var(--surface-light);
        color: var(--text);
        font: inherit;
      }

      input:focus {
        border-color: var(--silver);
        box-shadow: 0 0 0 3px rgba(197, 201, 206, 0.12);
      }

      button {
        width: 100%;
        min-height: 52px;
        margin-top: 2px;
        border: 1px solid #555b63;
        border-radius: 12px;
        background: var(--silver);
        color: #121519;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      button:focus-visible,
      .back-link:focus-visible {
        outline: 3px solid rgba(197, 201, 206, 0.32);
        outline-offset: 3px;
      }

      .status {
        margin: 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--muted);
        font-size: 0.88rem;
        line-height: 1.45;
        text-align: center;
      }

      .status[hidden] {
        display: none;
      }

      .back-link {
        display: block;
        width: fit-content;
        margin: 22px auto 0;
        color: var(--silver);
        font-size: 0.9rem;
        text-underline-offset: 4px;
      }

      @media (min-width: 500px) {
        main {
          padding: 48px 0;
        }

        form {
          padding: 28px;
        }
      }

      @media (max-width: 600px) {
        body::before {
          background:
            linear-gradient(
              180deg,
              rgba(9, 11, 13, 0.3),
              rgba(9, 11, 13, 0.72)
            ),
            url("assets/global-shared-stock-background.png") center 52% / 100%
              auto no-repeat;
          opacity: 0.82;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="content">
        <header>
          <p class="brand">Global Shared Stock</p>
          <h1>Entrar</h1>
          <p class="introduction">
            Acesso restrito à administração da plataforma.
          </p>
        </header>

        <form id="login-form">
          <div>
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required />
          </div>

          <div>
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" required />
          </div>

          <button id="submit-button" type="submit">Entrar</button>

          <p id="status" class="status" role="status" tabindex="-1" hidden>
            Não foi possível entrar.
          </p>
        </form>

        <a class="back-link" href="index.html">Voltar ao início</a>
      </div>
    </main>

    <script>
      const form = document.querySelector("#login-form");
      const status = document.querySelector("#status");
      const submitButton = document.querySelector("#submit-button");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (!form.reportValidity()) {
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = "Entrando...";
        status.hidden = true;

        try {
          const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: form.email.value,
              password: form.password.value,
            }),
          });

          if (!response.ok) {
            const result = await response.json();
            throw new Error(result.message || "E-mail ou senha incorretos.");
          }

          const next = new URLSearchParams(window.location.search).get("next");
          const safeNext = next?.startsWith("/") && !next.startsWith("//");
          const roleAllowsNext = result.role === "admin" ? !next?.startsWith("/empresa") : next?.startsWith("/empresa");
          window.location.href = safeNext && roleAllowsNext ? next : result.destination;
        } catch (error) {
          status.textContent = error.message;
          status.hidden = false;
          status.focus();
          form.password.value = "";
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = "Entrar";
        }
      });
    </script>
  </body>
</html>
